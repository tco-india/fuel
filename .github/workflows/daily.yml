name: daily-fuel

on:
  schedule:
    - cron: "30 1 * * *"  # 07:00 IST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e .
      - name: Scrape + merge + publish to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.scraper --push
      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: fuel-parquet
          path: output/fuel_prices.parquet
          if-no-files-found: warn
