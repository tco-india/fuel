[project]
name = "tco-fuel-scraper"
version = "0.1.0"
description = "TCO India — Daily fuel price scraper (IOCL) → HF bhavabhuthi/tco-india fuel module"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyarrow>=15",
    "duckdb>=1.0",
    "huggingface_hub>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
